name: Despliegue Automático a Hostinger - sinaloa

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Compilar y Subir Web
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código de GitHub
        uses: actions/checkout@v4

      - name: 2. Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 3. Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 4. Compilar la aplicación para Web
        run: flutter build web --release --pwa-strategy=none

      - name: 5. Generar archivo .htaccess para rutas de Flutter
        run: |
          echo "<IfModule mod_rewrite.c>" > build/web/.htaccess
          echo "  RewriteEngine On" >> build/web/.htaccess
          echo "  RewriteBase /" >> build/web/.htaccess
          echo "  RewriteRule ^index\.html$ - [L]" >> build/web/.htaccess
          echo "  RewriteCond %{REQUEST_FILENAME} !-f" >> build/web/.htaccess
          echo "  RewriteCond %{REQUEST_FILENAME} !-d" >> build/web/.htaccess
          echo "  RewriteRule . /index.html [L]" >> build/web/.htaccess
          echo "</IfModule>" >> build/web/.htaccess

      - name: 6. Subir por SCP a la carpeta de sinaloa
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "build/web/*"
          target: "domains/medicossinaloa.com/public_html"
          strip_components: 2
          overwrite: true
