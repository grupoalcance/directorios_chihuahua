name: Despliegue Automático a Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Compilar y Subir Web
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código de GitHub
        uses: actions/checkout@v4

      - name: 2. Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 3. Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 4. Compilar la aplicación para Web
        run: flutter build web --release

      - name: 5. Subir archivos por SFTP a Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          local_path: "./build/web/"
          remote_path: "/home/u492244081/domains/medicosdurango.com/public_html/"
          sftpOnly: true
